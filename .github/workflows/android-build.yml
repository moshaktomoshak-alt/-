name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  export-android:
    name: Export Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Linux runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libglu1-mesa libpulse0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Start ADB server
        run: |
          adb start-server
          adb devices

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android debug APK
        id: export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          presets_to_export: Android
          use_preset_export_path: true
          cache: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AboveTheDeath-android-apk
          path: ${{ steps.export.outputs.build_directory }}

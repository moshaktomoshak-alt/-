name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  export-android:
    name: Export Android (debug APK)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Create build output folder
        run: mkdir -v -p build/android

      - name: Export Android debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: |
          godot --headless --verbose --export-debug "Android" build/android/AboveTheDeath.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AboveTheDeath-android-apk
          path: build/android/AboveTheDeath.apk
